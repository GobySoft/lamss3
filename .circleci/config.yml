version: 2.1

jobs:
  format:
    docker:
      - image: ubuntu:noble
    resource_class: small
    steps:
      - run:
          name: Install prerequisites
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git openssh-client ca-certificates clang-format-18
      - checkout
      - run:
          name: clang-format-18 --dry-run --Werror
          command: |
            git ls-files -z -- '*.cpp' '*.cc' '*.h' '*.hpp' '*.proto' \
              | xargs -0 -r clang-format-18 --dry-run --Werror

  build:
    docker:
      - image: ubuntu:noble
    resource_class: large
    steps:
      - run:
          name: Install prerequisites
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git openssh-client ca-certificates
      - checkout
      - run:
          name: ./init.sh --yes
          command: ./init.sh --yes
      - run:
          name: lm b --test -D LAMSS_WERROR=ON
          command: ~/.local/bin/lm b --test -D LAMSS_WERROR=ON

workflows:
  ci:
    jobs:
      - format
      - build
