version: 2.1

environment-common: &environment-common
  DEBIAN_FRONTEND: "noninteractive"
  DEBIAN_PRIORITY: "critical"
  DEBCONF_NOWARNINGS: "yes"

executors:
  ubuntu:
    parameters:
      codename:
        type: enum
        enum: [jammy, noble, resolute]
        default: noble
      resource_class:
        type: string
        default: large
    docker:
      - image: ubuntu:<< parameters.codename >>
    resource_class: << parameters.resource_class >>
    working_directory: /root/lamss3
    environment:
      <<: *environment-common

commands:
  install-prerequisites:
    description: Install what checkout and init.sh need on a stock Ubuntu image
    parameters:
      extra:
        type: string
        default: ""
    steps:
      - run:
          name: Install prerequisites
          command: |
            apt-get update
            apt-get install -y --no-install-recommends \
              git openssh-client ca-certificates curl gpg lsb-release sudo << parameters.extra >>

  init:
    description: Run init.sh and load the active checkout's environment in later steps
    steps:
      - run:
          name: ./init.sh --yes
          command: ./init.sh --yes
      - run:
          name: Load the lamss environment
          command: |
            echo '. "$HOME/.config/lamss/env.sh"' >> "$BASH_ENV"
            . "$BASH_ENV"
            command -v lamss
            lamss env list

  cmake-build:
    description: Configure, build, install and test one toolbox as its own CMake project
    parameters:
      toolbox:
        type: string
    steps:
      - run:
          name: Build << parameters.toolbox >> standalone
          # not build/<tb>, which is where `lamss build` builds each toolbox
          command: |
            cmake -S << parameters.toolbox >> -B build/standalone/<< parameters.toolbox >> -G Ninja -DLAMSS_WERROR=ON
            cmake --build build/standalone/<< parameters.toolbox >> --target install
            ctest --test-dir build/standalone/<< parameters.toolbox >> --output-on-failure

jobs:
  format:
    executor:
      name: ubuntu
      resource_class: small
    steps:
      - install-prerequisites:
          extra: clang-format-18
      - checkout
      - run:
          name: clang-format-18 --dry-run --Werror
          command: |
            git ls-files -z -- '*.cpp' '*.cc' '*.h' '*.hpp' '*.proto' \
              | xargs -0 -r clang-format-18 --dry-run --Werror

  build-all:
    parameters:
      codename:
        type: enum
        enum: [jammy, noble, resolute]
      resource_class:
        type: string
    executor:
      name: ubuntu
      codename: << parameters.codename >>
      resource_class: << parameters.resource_class >>
    steps:
      - install-prerequisites
      - checkout
      - init
      - run:
          name: Activate every in-tree toolbox
          command: lamss toolbox activate autonomy sonar virtual_ocean
      - run:
          name: lamss dependencies install --yes
          command: lamss dependencies install --yes
      - run:
          name: lamss build --test -D LAMSS_WERROR=ON
          command: lamss build --test -D LAMSS_WERROR=ON

  build-standalone:
    parameters:
      toolbox:
        type: enum
        enum: [core, autonomy, sonar, virtual_ocean]
    executor: ubuntu
    steps:
      - install-prerequisites
      - checkout
      - init
      - unless:
          condition:
            equal: [core, << parameters.toolbox >>]
          steps:
            - run:
                name: Install << parameters.toolbox >> dependencies only
                command: |
                  lamss toolbox activate << parameters.toolbox >>
                  lamss dependencies install --yes
      - cmake-build:
          toolbox: core
      - unless:
          condition:
            equal: [core, << parameters.toolbox >>]
          steps:
            - cmake-build:
                toolbox: << parameters.toolbox >>

  env-switch:
    executor: ubuntu
    steps:
      - install-prerequisites
      - checkout
      - init
      - run:
          name: Set up a second checkout and switch between the two
          command: |
            git clone --quiet "$PWD" /root/second
            /root/second/init.sh --yes --no-deps
            . "$HOME/.config/lamss/env.sh"
            test "$LAMSS_ROOT" = /root/second
            lamss env list
            lamss env switch lamss3
            test "$LAMSS_ROOT" = /root/lamss3
            test "$(type -P lamss)" = /root/lamss3/build/usr/bin/lamss
            if echo "$PATH:$LD_LIBRARY_PATH:$PYTHONPATH" | grep -q /root/second; then exit 1; fi
            grep -qF '# >>> lamss >>>' "$HOME/.bashrc"

workflows:
  ci:
    jobs:
      - format
      - env-switch
      - build-standalone:
          name: build-<< matrix.toolbox >>-standalone
          matrix:
            parameters:
              toolbox: [core, autonomy, sonar, virtual_ocean]
      - build-all:
          name: build-all-<< matrix.codename >>-amd64
          resource_class: large
          matrix:
            parameters:
              codename: [jammy, noble, resolute]
      - build-all:
          name: build-all-<< matrix.codename >>-arm64
          resource_class: arm.large
          matrix:
            parameters:
              codename: [jammy, noble, resolute]
