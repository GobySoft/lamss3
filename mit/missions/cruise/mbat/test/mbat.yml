# Run with `lamss mission test mbat`.
test:
  name: mbat cruise
  default_timeout: 10
  require_app:
    - { endpoint: resolution_main, name: [gobyd, goby_logger, goby_coroner, goby_moos_gateway], require_ok: true, timeout: 30 }
    - { endpoint: macrura_main, name: [gobyd, goby_logger, goby_coroner, goby_moos_gateway], require_ok: true, timeout: 30 }
    - { endpoint: macrura_frontseat_sim, name: [gobyd, goby_logger, goby_coroner, goby_moos_gateway], require_ok: true, timeout: 30 }
  run:
    - name: macrura reports its position through pNodeReporter
      expect:
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          timeout: 60
    # pLamssMissionManager sends the initial deploy 30 s after the first GPS fix
    - name: macrura dives to the 15 m deploy depth
      expect:
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: depth, op: GT, value: 14.5 }]
          timeout: 240
    # plan 10's M1 gate: once settled, the vehicle holds the commanded 15 m (± 2 m) on its loiter
    - name: macrura holds 15 m and its 200 m loiter around the deploy point
      expect:
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: depth, op: LT, value: 13 }]
          count: 0
          timeout: 40
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: depth, op: GT, value: 17 }]
          count: 0
          timeout: 40
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: x, op: LT, value: -300 }]
          count: 0
          timeout: 40
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: x, op: GT, value: 300 }]
          count: 0
          timeout: 40
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: y, op: LT, value: -300 }]
          count: 0
          timeout: 40
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: y, op: GT, value: 300 }]
          count: 0
          timeout: 40
    - name: macrura's LAMSS_STATUS reaches resolution over acomms
      expect:
        - endpoint: resolution_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          timeout: 60
        - endpoint: resolution_main
          group: '^goby::middleware::frontseat::node_status$'
          type: goby.middleware.frontseat.protobuf.NodeStatus
          match: 'name: "macrura"'
          timeout: 60
    # sent the way goby_liaison's commander sends it; the next resolution slot carries it
    - name: resolution redeploys macrura to 25 m over acomms
      publish:
        - endpoint: resolution_main
          group: 'lamss::goby::pAcommsHandler_multiplex'
          type: PROTOBUF/lamss.autonomy.LAMSS_DEPLOY
          value: '_rcv_id: 4 Deploy_Mode: DEPLOY_MODE_LOITER Depth_Mode: DEPTH_MODE_SINGLE Deploy_X: 0 Deploy_Y: 0 Deploy_Speed: 1.8 Deploy_Upper_Depth: 25 Loiter_Radius: 200 Loiter_Segments: 6'
      expect:
        - endpoint: macrura_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'name: "macrura"'
          condition: [{ field: depth, op: GT, value: 23 }]
          timeout: 180
    - name: macrura tracks the simulated target and reports the track to resolution
      publish:
        - endpoint: resolution_main
          group: 'lamss::goby::pAcommsHandler_multiplex'
          type: PROTOBUF/lamss.autonomy.LAMSS_DEPLOY
          value: '_rcv_id: 4 Deploy_Mode: DEPLOY_MODE_LOITER Depth_Mode: DEPTH_MODE_SINGLE Sonar_Control: SONAR_CONTROL_ON Sonar_Process: SONAR_PROCESS_ON Deploy_X: 0 Deploy_Y: 0 Deploy_Speed: 1.8 Deploy_Upper_Depth: 15 Loiter_Radius: 200 Loiter_Segments: 6'
      expect:
        - endpoint: resolution_main
          group: '^lamss::moos::NODE_REPORT$'
          type: lamss.core.LegacyNodeReport
          match: 'type: "track"'
          timeout: 540
