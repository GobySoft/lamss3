    MISSION_STATE_DIVING = 3;
    MISSION_STATE_DEPLOY = 4;
    MISSION_STATE_PROSECUTE = 5;
    MISSION_STATE_ABORT = 6;
    MISSION_STATE_DRIFTING = 7;
    MISSION_STATE_SURFACING = 8;
}

enum BearingTrackEnum
{
    TRACKING_IDLE = 0;
