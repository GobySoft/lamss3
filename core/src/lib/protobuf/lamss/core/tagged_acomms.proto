syntax = "proto2";

import "goby/acomms/protobuf/modem_message.proto";

package lamss.core;

message NamedModemTransmission
{
    optional string name = 1;
    optional int32 index = 2;
    required goby.acomms.protobuf.ModemTransmission msg = 3;
}

message NamedModemRaw
{
    optional string name = 1;
    optional int32 index = 2;
    required goby.acomms.protobuf.ModemRaw msg = 3;
}
