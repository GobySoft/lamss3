syntax = "proto2";

import "dccl/option_extensions.proto";

package lamss.core;

message VIEW_SEGLIST
{
    option (dccl.msg).id = 57;
    option (dccl.msg).max_bytes = 96;
    option (dccl.msg).codec_version = 4;
    optional double _time = 1
        [(dccl.field).codec = "_time", (dccl.field).in_head = true];
    optional int32 vehicle_name = 2 [
        (dccl.field).max = 31,
        (dccl.field).min = 0,
        (dccl.field).in_head = true
    ];
    optional int32 destination = 3 [
        (dccl.field).max = 31,
        (dccl.field).min = 0,
        (dccl.field).in_head = true
    ];
    optional bool active = 4;
    optional MissionEnum mission = 5;
    enum MissionEnum
    {
        MISSION_UNKNOWN = 0;
        MISSION_DEPLOY = 1;
        MISSION_PROSECUTE = 2;
        MISSION_RETURN = 3;
        MISSION_TRANSIT = 4;
    }
    repeated double point_x = 6 [
        (dccl.field).max = 180.000000,
        (dccl.field).min = -180.000000,
        (dccl.field).precision = 5,
        (dccl.field).max_repeat = 13
    ];
    repeated double point_y = 7 [
        (dccl.field).max = 90.000000,
        (dccl.field).min = -90.000000,
        (dccl.field).precision = 5,
        (dccl.field).max_repeat = 13
    ];

    optional string label = 10 [(dccl.field).omit = true];

    enum PolyType
    {
        POLYTYPE_NORMAL = 0;
        POLYTYPE_OPBOX = 1;
        POLYTYPE_OBSTACLE = 2;
    }
    optional PolyType polytype = 11;
}
