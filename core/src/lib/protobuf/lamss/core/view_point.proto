import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";
message VIEW_POINT { 
	option (dccl.msg).id = 155;
	option (dccl.msg).max_bytes = 16;
        option (dccl.msg).codec_version = 4;
	optional double _time = 1 [(dccl.field).codec="_time", (dccl.field).in_head=true];
	optional int32 vehicle_name = 2 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional int32 destination = 3 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional bool active = 4;
	optional TypeEnum type = 5;
	enum TypeEnum{ 
		 TYPE_WAYPOINT = 0; 
		 TYPE_TRAILPOINT = 1; 
		 TYPE_ATTRACTOR = 2; 
		 TYPE_STATION = 3; 
	} 
	optional double point_lon = 6 [(dccl.field).max=180.000000, (dccl.field).min=-180.000000, (dccl.field).precision=5];
	optional double point_lat = 7 [(dccl.field).max=90.000000, (dccl.field).min=-90.000000, (dccl.field).precision=5];
} 

