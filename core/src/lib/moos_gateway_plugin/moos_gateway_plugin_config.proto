syntax = "proto2";

import "goby/moos/protobuf/moos_gateway_config.proto";

package lamss.core;

message GobyGatewayConfig
{
    optional string multiplex_moos_var = 1 [default = "LIAISON_COMMANDER_OUT"];
    repeated string load_shared_library = 2;
}

extend goby.apps.moos.protobuf.GobyMOOSGatewayConfig
{
    optional GobyGatewayConfig goby_gateway_config = 1000;
}
