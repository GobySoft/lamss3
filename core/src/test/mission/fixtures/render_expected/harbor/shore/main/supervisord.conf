; harbor: shore/main, generated by lamss mission

[group:shore_main]
programs=shore_main_daemon,shore_main_moosdb,shore_main_app

[program:shore_main_daemon]
process_name=daemon
command=sleep 300
directory=%(here)s
priority=10
autostart=true
autorestart=unexpected
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../../../run/harbor/log/shore/main/daemon.out
redirect_stderr=true
environment=LAMSS_ROOT="@ROOT@",LAMSS_PREFIX="@ROOT@/build/usr",LAMSS_INSTANCE="harbor",LAMSS_CRUISE="harbor",LAMSS_PLATFORM="shore",LAMSS_SUBSYSTEM="main",LAMSS_RUN="@ROOT@/extra/missions/run/harbor/shore/main",LAMSS_LOG="@ROOT@/extra/missions/run/harbor/log/shore/main",LAMSS_WARP="1",DAEMON_PORT="24000",PATH="@ROOT@/build/usr/bin:%(ENV_PATH)s",LD_LIBRARY_PATH="@ROOT@/build/usr/lib"

[program:shore_main_moosdb]
process_name=moosdb
command=sleep 301
directory=%(here)s
priority=20
autostart=true
autorestart=unexpected
startsecs=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../../../run/harbor/log/shore/main/moosdb.out
redirect_stderr=true
environment=LAMSS_ROOT="@ROOT@",LAMSS_PREFIX="@ROOT@/build/usr",LAMSS_INSTANCE="harbor",LAMSS_CRUISE="harbor",LAMSS_PLATFORM="shore",LAMSS_SUBSYSTEM="main",LAMSS_RUN="@ROOT@/extra/missions/run/harbor/shore/main",LAMSS_LOG="@ROOT@/extra/missions/run/harbor/log/shore/main",LAMSS_WARP="1",DAEMON_PORT="24000",PATH="@ROOT@/build/usr/bin:%(ENV_PATH)s",LD_LIBRARY_PATH="@ROOT@/build/usr/lib"

[program:shore_main_app]
process_name=app
command=sleep 302
directory=%(here)s
priority=30
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../../../run/harbor/log/shore/main/app.out
redirect_stderr=true
environment=LAMSS_ROOT="@ROOT@",LAMSS_PREFIX="@ROOT@/build/usr",LAMSS_INSTANCE="harbor",LAMSS_CRUISE="harbor",LAMSS_PLATFORM="shore",LAMSS_SUBSYSTEM="main",LAMSS_RUN="@ROOT@/extra/missions/run/harbor/shore/main",LAMSS_LOG="@ROOT@/extra/missions/run/harbor/log/shore/main",LAMSS_WARP="1",DAEMON_PORT="24000",PATH="@ROOT@/build/usr/bin:%(ENV_PATH)s",LD_LIBRARY_PATH="@ROOT@/build/usr/lib"
