; harbor: buoy/sensors, generated by lamss mission

[group:buoy_sensors]
programs=buoy_sensors_daemon

[program:buoy_sensors_daemon]
process_name=daemon
command=sleep 303
directory=%(here)s
priority=10
autostart=true
autorestart=unexpected
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../../../run/harbor/log/buoy/sensors/daemon.out
redirect_stderr=true
environment=LAMSS_ROOT="@ROOT@",LAMSS_PREFIX="@ROOT@/build/usr",LAMSS_INSTANCE="harbor",LAMSS_CRUISE="harbor",LAMSS_PLATFORM="buoy",LAMSS_SUBSYSTEM="sensors",LAMSS_RUN="@ROOT@/extra/missions/run/harbor/buoy/sensors",LAMSS_LOG="@ROOT@/extra/missions/run/harbor/log/buoy/sensors",LAMSS_WARP="1",DAEMON_PORT="24004",PATH="@ROOT@/build/usr/bin:%(ENV_PATH)s",LD_LIBRARY_PATH="@ROOT@/build/usr/lib"
