import "goby/moos/protobuf/goby_moos_app.proto";
import "goby/protobuf/option_extensions.proto";

message iLineBasedCommsConfig
{
    optional goby.moos.protobuf.GobyMOOSAppConfig common = 1 [
        (goby.field).description =
            "Configuration common to all Goby MOOS applications"
    ];  // see tes_moos_app.proto

    optional string write_to_var = 2
        [(goby.field).description = "Variable to write incoming message"];
    optional string read_from_var = 3
        [(goby.field).description = "Variable to read outgoing messages from"];

    enum ConnectionType
    {
        CONNECTION_SERIAL =
            1;  // Modem is connected by a tty serial line (e.g. RS-232)
        CONNECTION_TCP_AS_CLIENT =
            2;  // Modem is connected by ethernet and is serving clients
        CONNECTION_TCP_AS_SERVER =
            3;  // Modem is connected by ethernet and expects us to serve it
        CONNECTION_DUAL_UDP_BROADCAST = 4;  // Presently unimplemented
    }

    optional ConnectionType connection_type = 20 [
        default = CONNECTION_SERIAL,
        (goby.field).description =
            "Physical connection type from this computer (running Goby) to the GPS"
    ];

    // required if connection_type == CONNECTION_SERIAL
    optional string serial_port = 21 [
        (goby.field).description = "Serial port for CONNECTION_SERIAL",
        (goby.field).example = "/dev/ttyS0"
    ];
    optional uint32 serial_baud = 22 [
        (goby.field).description = "Baud rate for CONNECTION_SERIAL",
        (goby.field).example = "19200"
    ];

    // required if connection_type == CONNECTION_TCP_AS_CLIENT
    optional string tcp_server = 23 [
        (goby.field).description =
            "IP Address or domain name for the server if CONNECTION_TCP_AS_CLIENT",
        (goby.field).example = "192.168.1.111"
    ];

    // required if connection_type == CONNECTION_TCP_AS_CLIENT or
    // CONNECTION_TCP_AS_SERVER
    optional uint32 tcp_port = 24 [
        (goby.field).description =
            "Port to serve on (for CONNECTION_TCP_AS_SERVER) or to connect to (for CONNECTION_TCP_AS_CLIENT)",
        (goby.field).example = "50010"
    ];

    message BridgePair
    {
        required string local_var = 1;
        optional string remote_var = 2;
    }

    repeated BridgePair bridge = 30;
}
