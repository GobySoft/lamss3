import "@GOBY_MOOS_APP_PROTO@";
import "@GOBY_OPTION_EXTENSIONS_PROTO@";

package lamss.protobuf;

message Point
{
  required double x = 1;
  required double y = 2;
  optional double z = 3 [default = 0];
}


message ViewPoint
{
  required string vehicle_name = 1;
  required Point point = 2;
  optional bool active = 3 [default = false];
  enum PointType
  {
    UNKNOWN = 0;
    WAYPOINT = 1;
    TRAILPOINT = 2;
    ATTRACTOR = 3;
    STATION = 4;
  }
  optional PointType type = 4 [default = UNKNOWN];
  required int32 destination = 5;
}

message ViewSegList
{
  required string vehicle_name = 1;
  enum MissionType
  {
    UNKNOWN = 0;
    DEPLOY = 1;
    PROSECUTE = 2;
    RETURN = 3;
    TRANSIT = 4;
  }
  optional MissionType mission = 2 [default = UNKNOWN];
  repeated Point point = 3;
  optional bool active = 4 [default = false];
  required int32 destination = 5;
}

message ViewMessageConfig
{
  optional @GOBY_MOOS_APP_NAME@Config common = 1 [@GOBY_FIELD_DESCRIPTION@="Configuration common to all Goby MOOS applications"]; // see tes_moos_app.proto
}
