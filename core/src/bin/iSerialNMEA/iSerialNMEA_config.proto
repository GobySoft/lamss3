import "goby/moos/libmoos_util/tes_moos_app.proto";
import "goby/protobuf/option_extensions.proto";

message iSerialNMEAConfig
{
  optional TesMoosAppConfig common = 1 [(description)="Configuration common to all Goby MOOS applications"]; // see tes_moos_app.proto

  optional int32 fixed_depth = 2 [(description)="Fix a depth for the vehicle", default=0];
  required string vehicle_name = 3 [(description)="Name of the vehicle whose information is begin read"];
  required string vehicle_type = 4 [(description)="Type of the vehicle being read"];

  optional uint32 wait = 5 [(description)="blackout time between postings (in seconds)"];

  enum InputType 
  {
    INPUT_PORT = 1;
    INPUT_MOOSDB = 2;
  }
  optional InputType input = 6 [(description)="What source to read serial stream from", default=INPUT_PORT];
  
  optional string raw_var_to_write = 9 [(description)="MOOS variable to write raw output on (if input == INPUT_PORT"];
  
  optional string raw_var_to_read = 10 [(description)="MOOS variable to read raw output on (if input == INPUT_MOOSDB"];

  optional string out_status_var = 11 [(description)="MOOS variable to write parsed node report on"];
  
  enum ConnectionType { CONNECTION_SERIAL = 1; // Modem is connected by a tty serial line (e.g. RS-232)
                        CONNECTION_TCP_AS_CLIENT = 2; // Modem is connected by ethernet and is serving clients
                        CONNECTION_TCP_AS_SERVER = 3; // Modem is connected by ethernet and expects us to serve it
                        CONNECTION_DUAL_UDP_BROADCAST = 4; // Presently unimplemented
  }
    
  optional ConnectionType connection_type = 20 [default = CONNECTION_SERIAL, (description)="Physical connection type from this computer (running Goby) to the GPS"];
  
  // required if connection_type == CONNECTION_SERIAL
  optional string serial_port = 21 [(description)="Serial port for CONNECTION_SERIAL", (example)="/dev/ttyS0"]; 
  optional uint32 serial_baud = 22 [(description)="Baud rate for CONNECTION_SERIAL", (example)="19200"]; 

  // required if connection_type == CONNECTION_TCP_AS_CLIENT
  optional string tcp_server = 23 [(description)="IP Address or domain name for the server if CONNECTION_TCP_AS_CLIENT", (example)="192.168.1.111"]; 

  // required if connection_type == CONNECTION_TCP_AS_CLIENT or CONNECTION_TCP_AS_SERVER
  optional uint32 tcp_port = 24 [(description)="Port to serve on (for CONNECTION_TCP_AS_SERVER) or to connect to (for CONNECTION_TCP_AS_CLIENT)", (example)="50010"];

  
}

