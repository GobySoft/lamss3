syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/protobuf/option_extensions.proto";

package lamss.tool.protobuf;

message LamssToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: true
        has_help_action: true
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    enum Action
    {
        // short names are protobuf enum aliases: the Goby3 tool framework looks
        // actions up by name
        option allow_alias = true;

        help = 0 [(goby.ev).cfg = {
            short_help_msg: "Print usage information",
            full_help_msg: "Usage: \"lamss help [action]\"\n"
                           "Provides detailed usage information on the provided action.\n"
                           "Example: \"lamss help build\" provides help on the 'build' action.\n"
                           "Every action also accepts --help."
        }];
        build = 1 [(goby.ev).cfg = {
            short_help_msg: "Configure (if needed), build and install the active toolboxes"
        }];
        b = 1 [(goby.ev).cfg = { short_help_msg: "Short for \"build\"" }];
        toolbox = 2 [(goby.ev).cfg = {
            short_help_msg: "List, add, remove, activate and deactivate toolboxes"
        }];
        tb = 2 [(goby.ev).cfg = { short_help_msg: "Short for \"toolbox\"" }];
        env = 3 [(goby.ev).cfg = {
            short_help_msg: "Print shell exports for using the build: eval \"$(lamss env)\""
        }];
        clean = 4 [(goby.ev).cfg = { short_help_msg: "Remove build products" }];
    }
    optional Action action = 2 [
        default = help,
        (goby.field) = {
            description: "The action this tool should take [can omit --action if 1st parameter]",
            cfg { position: { enable: true }, cli_short: "A", action: HIDDEN }
        }
    ];
}

message BuildToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    optional bool configure = 2 [
        default = false,
        (goby.field) = {
            description: "Force CMake to reconfigure (automatic when .lamss/toolboxes is newer "
                         "than build/CMakeCache.txt)"
        }
    ];

    optional string toolbox = 3 [(goby.field) = {
        description: "Build and install only this toolbox (target lamss_<toolbox>_all)"
    }];

    enum BuildType
    {
        Debug = 1;
        Release = 2;
        RelWithDebInfo = 3;
        MinSizeRel = 4;
    }
    optional BuildType type = 4 [(goby.field) = {
        description: "CMAKE_BUILD_TYPE; RelWithDebInfo on first configure, then remembered in build/"
    }];

    optional int32 jobs = 5 [(goby.field) = {
        description: "Parallel build jobs (default: number of processors)",
        cfg { cli_short: "j" }
    }];

    optional bool test = 6 [
        default = false,
        (goby.field) = { description: "Run ctest after building" }
    ];

    repeated string define = 7 [(goby.field) = {
        description: "KEY=VALUE passed to CMake as -DKEY=VALUE (forces a reconfigure)",
        cfg { cli_short: "D" }
    }];
}

message ToolboxToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: true
        has_help_action: true
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    enum Action
    {
        help = 0 [(goby.ev).cfg = {
            short_help_msg: "Print usage information",
            full_help_msg: "Usage: \"lamss toolbox help [action]\""
        }];
        list = 1 [(goby.ev).cfg = {
            short_help_msg: "List known toolboxes: kind, active, path and git describe"
        }];
        add = 2 [(goby.ev).cfg = {
            short_help_msg: "Add an external toolbox as a git submodule (or an in-tree one by name) and activate it"
        }];
        remove = 3 [(goby.ev).cfg = {
            short_help_msg: "Deactivate an external toolbox and remove its submodule"
        }];
        activate = 4 [(goby.ev).cfg = {
            short_help_msg: "Activate toolboxes and the toolboxes they require"
        }];
        deactivate = 5
            [(goby.ev).cfg = { short_help_msg: "Deactivate toolboxes" }];
    }
    optional Action action = 2 [
        default = help,
        (goby.field) = {
            description: "The action this tool should take [can omit --action if 1st parameter]",
            cfg { position: { enable: true }, cli_short: "A", action: HIDDEN }
        }
    ];
}

message ToolboxListToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];
}

message ToolboxAddToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    required string source = 2 [(goby.field) = {
        description: "Git URL of an external toolbox, or the name of an in-tree toolbox",
        cfg { position: { enable: true } }
    }];

    optional string name = 3 [(goby.field) = {
        description: "Directory (and toolbox) name for a git URL (default: the repository name)",
        cfg { position: { enable: true } }
    }];
}

message ToolboxRemoveToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    required string name = 2 [(goby.field) = {
        description: "Submodule toolbox to remove",
        cfg { position: { enable: true } }
    }];

    optional bool force = 3 [
        default = false,
        (goby.field) = {
            description: "Also deactivate active toolboxes that require it"
        }
    ];
}

message ToolboxActivateToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    repeated string name = 2 [(goby.field) = {
        description: "Toolboxes to activate",
        cfg { position: { enable: true, max_count: -1 } }
    }];
}

message ToolboxDeactivateToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    repeated string name = 2 [(goby.field) = {
        description: "Toolboxes to deactivate",
        cfg { position: { enable: true, max_count: -1 } }
    }];

    optional bool force = 3 [
        default = false,
        (goby.field) = {
            description: "Also deactivate active toolboxes that require these"
        }
    ];
}

message EnvToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];
}

message CleanToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    optional bool yes = 2 [
        default = false,
        (goby.field) = {
            description: "Do not ask for confirmation",
            cfg { cli_short: "y" }
        }
    ];

    optional bool all = 3 [
        default = false,
        (goby.field) = {
            description: "Remove all of build/, including the lamss tool itself (re-run ./init.sh afterwards)"
        }
    ];
}
