# Format: core/src/doc/plan/claude/03-lamss-tool.md#lamss-dependencies-listinstall--lm-dep
# netsim has no package for resolute; without it uSimModemNetwork and iNetSimManager are not built.
apt:
  all:
    - libgsl-dev
    - libnetcdf-dev
    - libboost-filesystem-dev
  jammy:
    - libnetsim-dev
    - libb64-dev
    - libboost-serialization-dev
  noble:
    - libnetsim-dev
    - libb64-dev
    - libboost-serialization-dev
