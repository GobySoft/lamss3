import "dccl/option_extensions.proto";

import "goby/protobuf/option_extensions.proto";
import "goby/acomms/protobuf/mm_driver.proto";

message TransmitResponse
{
    required string source = 1;
    required string receiver = 2;
    required double pingtime = 3;
    optional double timestamp = 4;
    optional string file = 5;  // augments replica_path with contact names
    optional int32 channels = 6;
    optional int32 samples = 7;
}

message TransmitRequest
{
    required string source = 1;
    required string receiver = 2;
    required double pingtime = 3;
    required string replica_path = 4;  // Must have extension .dat
}

message ArrayGain
{
    repeated BeamGain beam_gain = 1;
    message BeamGain
    {
        required double elevation = 1
            [(goby.field).description = "Arrival beam elevation in degrees"];
        required double gain_db = 2 [(goby.field).description = "dB"];
    }
}

message TransmitGroupVelocity
{
    required double timestamp = 1;
    required string source = 2;
    required string receiver = 3;
    required double range = 4;
    required double delay = 5;
    required double group_velocity = 6;
    required double group_velocity_std = 7;
}

enum ModemPerformanceMetric
    {
     SNR = 1;
     MPP = 2;
     MAE = 3;
    }

message I2M_FloatSamples
{
   repeated float re=11 [packed=true]; // Real part of sampled signal for FLOAT32 sample types
   repeated float im=12 [packed=true]; // Imaginary part of sampled signal (N/A for PASSBAND_REAL)
}

message I2M_IntSamples
{
   repeated sint32 re=13 [packed=true]; // Real part of sampled signal for INT32 sample types
   repeated sint32 im=14 [packed=true]; // Imaginary part of sampled signal (N/A for PASSBAND_REAL)
}

message I2M_signal
{
  enum SAMPLE_TYPES
  {
    BASEBAND_COMPLEX_FLOAT32 = 0;  // Baseband floating point samples
    PASSBAND_REAL_FLOAT32 = 1;     // Passband real samples
    BASEBAND_COMPLEX_INT32 = 2;         
    PASSBAND_REAL_INT32 = 3;
    PASSBAND_REAL_BYTES = 4;
  }
  required SAMPLE_TYPES sample_type=1;
  required float sample_rate=2;    // Nominal Sampling rate of the signal in Hz
  required float scale=3;          // Maximum allowed value for signal waveform
  optional int32 block_scale_shift=4;       // Block Normalization factor for  integer data                                           
  optional uint32 channel_id=5;    // Identifier for receive/transmit element
  optional float carrier_freq=6;   // Carrier frequency for Basebanded signals in Hz  
  optional float bandwidth = 10;  //  Utilized bandwidth of signal
  optional fixed64 timestamp=7;    // Timestamp of first sample in the packet.
  optional float physical_scale=8; //  maps signal space to voltage or uPa etc    

   oneof samples
 {
     I2M_IntSamples int_samples = 11;
     I2M_FloatSamples float_samples = 12;
     bytes signal_bytes = 13;
 }

}

