syntax = "proto2";

import "goby/protobuf/option_extensions.proto";
import "goby/moos/protobuf/goby_moos_app.proto";

package lamss.virtual_ocean;

message InterfaceNetSimManagerConfig
{
    optional goby.moos.protobuf.GobyMOOSAppConfig common = 1 [
        (goby.field).description =
            "Configuration common to all Goby MOOS applications"
    ];  // see tes_moos_app.proto

    required string netsim_manager_ip_addr = 2;
    optional uint32 netsim_manager_tcp_port = 3 [default = 61999];
    optional uint32 reconnect_interval = 4 [default = 10];

    required uint32 modem_tcp_port = 10;

    enum NavigationSource
    {
        IFRONTSEAT = 1;
        NODE_REPORT = 2;
    }

    optional NavigationSource nav_source = 20 [default = IFRONTSEAT];
    optional string node_report_var = 21 [default = "NODE_REPORT"];
    optional string node_report_name = 23;

    message ModemIdMapping
    {
        required uint32 modem_id = 1;
        required uint32 modem_tcp_port = 2;
    }
    repeated ModemIdMapping modem_id_mapping = 22;
}
