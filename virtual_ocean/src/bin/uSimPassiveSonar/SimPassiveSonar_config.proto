
import "goby/moos/protobuf/goby_moos_app.proto";
import "goby/common/protobuf/option_extensions.proto";

message SimPassiveSonarConfig
{
  optional GobyMOOSAppConfig common = 1 [(goby.field).description="Configuration common to all Goby MOOS applications"]; // see goby_moos_app.proto

  optional bool ray_acoustics = 2 [default = false];
  optional bool rap_acoustics   = 3 [default = false];
  optional double svp_surface   = 4 [default = 1430];
  optional double svp_gradient = 5 [default = 0.016];
  optional double max_rap_depth = 6 [default = 5000];
  optional double water_depth = 7 [default = 5000];
  optional double bottom_loss = 8 [default = 0.5];
  optional double noise_level = 9 [default = 50];
  optional ArrayTypeEnum array_type = 10 [default = ARRAY_TYPE_HYD];
  enum ArrayTypeEnum {
     ARRAY_TYPE_HYD = 1;
     ARRAY_TYPE_VSA = 2;
     ARRAY_TYPE_DURIP = 3;
  }
  optional int32  max_number_bounces = 11  [default = 1];
  required int32  num_array_elements = 12 ;
  required double sampling_frequency = 13 ;
  required int32  num_samples = 14 ;
  optional double hydrophone_gain = 15 [default = 0];
  optional double accelerometer_gain = 16 [default = 0];
  required string base_dir_name = 17 ;
  optional string acoustic_filename_prefix = 18 [default = "HYD"];
  optional string acoustic_filename_suffix = 19 [default = ".DAT"];
  optional string nonacoustic_filename_prefix = 20 [default = "NAS"];
  optional string nonacoustic_filename_suffix = 21 [default = ".DAT"];
  optional bool   mseas_svp_updates = 23 [default = false];
  optional double mseas_update_interval = 24 [default = 60];
  optional double svp_range_resolution = 25 [default = 200];
  optional double svp_depth_resolution = 26 [default = 20];
  optional bool   pinger_enabled = 27 [default = false];
  optional double pinger_x = 28 [default = 0];
  optional double pinger_y = 29 [default = 0];
  optional double pinger_depth = 30 [default = 0];
  optional double pinger_db = 31 [default = 130];
  optional WindowShading replica_window = 32 [default = WINDOW_TUKEY];
  enum WindowShading {
     WINDOW_TUKEY = 1;
     WINDOW_HANN = 2;
     WINDOW_NONE = 3;
  }
  optional string pinger_waveform_file = 33 [default = ""];
  optional string sync_path = 22 [default = ""];
  optional string sync_password = 34 [default = "REDACTED"];
}


