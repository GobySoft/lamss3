
import "goby/moos/protobuf/goby_moos_app.proto";
import "goby/common/protobuf/option_extensions.proto";

message SimModemNetworkConfig
{
  optional GobyMOOSAppConfig common = 1 [(goby.field).description="Configuration common to all Goby MOOS applications"]; // see goby_moos_app.proto
  optional string base_dir_name = 5 ;
  optional double acomms_frequency = 10 [default = 4000];
  optional double acomms_bandwidth = 11 [default = 2000];
  
  optional string test_replica = 12 [default = "replica.dat"];
  optional double noise_level = 13 [default = 40];
  optional int32  max_number_bounces = 20  [default = 1];
  optional double raytracing_interval = 21 [default = 30];
  optional double raytracing_range_box = 22 [default = 20];
  optional bool   mseas_svp_updates = 23 [default = false];
  optional double mseas_update_interval = 24 [default = 60];
  optional double svp_range_resolution = 25 [default = 200];
  optional double svp_depth_resolution = 26 [default = 20];

  repeated string node = 30;
  
  repeated ArrayElement  array_element = 40;
  message ArrayElement
    {
      optional double x_offset = 1 [default = 0];
      optional double y_offset = 2 [default = 0];
      optional double z_offset = 3 [default = 0];
    }

}


