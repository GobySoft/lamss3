import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";

message ActiveSonarParameters
{
    optional ProcessingObjectiveEnum processing_objective = 3
        [default = TARGET];
    enum ProcessingObjectiveEnum
    {
        NOISE = 1;
        TARGET = 2;
    }
    optional int32 fft_size = 4;
    optional double overlap = 5;
    optional double sampling_frequency = 6;
    optional double bandwidth = 7;
    optional int32 num_bins = 8;
    optional double mean_frequency = 11;
    optional string frequency_bins = 12;
    optional string bin_center_frequencies = 13;
}
