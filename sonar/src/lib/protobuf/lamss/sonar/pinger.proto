import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";

message LAMSS_PINGER_COMMAND { 
	option (dccl.msg).id = 59;
	option (dccl.msg).max_bytes = 32;
        option (dccl.msg).codec_version = 4;
	optional double _time = 1 [(dccl.field).codec="_time", (dccl.field).in_head=true];
	optional int32 _src_id = 2 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional int32 _rcv_id = 3 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional string MessageType = 4 [default="LAMSS_PINGER_COMMAND", (dccl.field).static_value="LAMSS_PINGER_COMMAND", (dccl.field).codec="_static"];
    optional bool pinger_active = 5 [default = true];
    optional double pingtime = 6 [(dccl.field).codec="dccl.time2", (dccl.field).in_head=false, default=0];
    optional double pinger_x = 7 [default=0, (dccl.field).max=250000, (dccl.field).min=-100000, (dccl.field).precision=0];
    optional double pinger_y = 8 [default=0, (dccl.field).max=250000, (dccl.field).min=-100000, (dccl.field).precision=0];
    optional double pinger_depth = 9 [default=10, (dccl.field).max=6000, (dccl.field).min=0, (dccl.field).precision=1];
    optional int32 pinger_heading = 10 [(dccl.field).max=359, (dccl.field).min=0];
    optional double pinger_speed = 11 [(dccl.field).max=30.0, (dccl.field).min=0.0, (dccl.field).precision=1];    
    optional WaveformEnum waveform = 12 [default=WAVEFORM_LFM];
    enum WaveformEnum {
       WAVEFORM_CW = 1;
       WAVEFORM_LFM = 2;
       WAVEFORM_HFM = 3;
       WAVEFORM_IMP = 4;
       WAVEFORM_FILE = 5;
       }
    optional WindowShading replica_window = 13 [default = WINDOW_TUKEY];
    enum WindowShading {
     WINDOW_TUKEY = 1;
     WINDOW_HANN = 2;
     WINDOW_NONE = 3;
    }
    optional double center_frequency = 14 [(dccl.field).max=16000, (dccl.field).min=0, (dccl.field).precision=1, default=4000];
    optional double bandwidth = 15 [(dccl.field).max=4000, (dccl.field).min=0, (dccl.field).precision=1, default=2000];
    optional double pulsewidth = 16 [(dccl.field).max=4.0, (dccl.field).min=0, (dccl.field).precision=3, default=1.0];
    optional double pinger_db = 17 [default=0, (dccl.field).max=250, (dccl.field).min=0, (dccl.field).precision=1];
    optional uint32 ping_interval = 18 [default=0, (dccl.field).max=180, (dccl.field).min=0];
} 

