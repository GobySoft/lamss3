import "dccl/protobuf/option_extensions.proto";
import "goby/common/protobuf/option_extensions.proto";

message LAMSS_PINGER_COMMAND { 
	option (dccl.msg).id = 59;
	option (dccl.msg).max_bytes = 32;
	optional double _time = 1 [(dccl.field).codec="_time", (dccl.field).in_head=true];
	optional int32 _src_id = 2 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional int32 _rcv_id = 3 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional string MessageType = 4 [default="LAMSS_PINGER_COMMAND", (dccl.field).static_value="LAMSS_PINGER_COMMAND", (dccl.field).codec="_static"];
    optional bool pinger_active = 5 [default = true];
    optional double pingtime = 6 [(dccl.field).codec="_time", (dccl.field).in_head=false, default=0];
    optional WaveformEnum waveform = 7 [default=WAVEFORM_LFM];
    enum WaveformEnum {
       WAVEFORM_CW = 1;
       WAVEFORM_LFM = 2;
       WAVEFORM_HFM = 3;
       WAVEFORM_FILE = 4;
       }
    optional double center_frequency = 8 [(dccl.field).max=16000, (dccl.field).min=0, (dccl.field).precision=1, default=100];
    optional double bandwidth = 9 [(dccl.field).max=4000, (dccl.field).min=0, (dccl.field).precision=1, default=100];
    optional double pulsewidth = 10 [(dccl.field).max=60, (dccl.field).min=0, (dccl.field).precision=3, default=1];
} 
