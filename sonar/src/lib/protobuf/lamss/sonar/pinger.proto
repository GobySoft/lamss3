    optional double pulsewidth = 16 [(dccl.field).max=4, (dccl.field).min=0, (dccl.field).precision=3, default=1];
    optional double pinger_db = 17 [default=0, (dccl.field).max=180, (dccl.field).min=0, (dccl.field).precision=1];
