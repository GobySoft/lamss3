import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";
message LAMSS_TRACK { 
	option (dccl.msg).id = 25;
	option (dccl.msg).max_bytes = 32;
	optional double time = 1 [(dccl.field).codec="_time", (dccl.field).in_head=true];
	optional int32 node = 2 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional int32 _dest_id = 3 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional string MessageType = 4 [default="LAMSS_TRACK", (dccl.field).static_value="LAMSS_TRACK", (dccl.field).codec="_static"];
	optional double nav_x = 5 [(dccl.field).max=100000, (dccl.field).min=-100000, (dccl.field).precision=0];
	optional double nav_y = 6 [(dccl.field).max=100000, (dccl.field).min=-100000, (dccl.field).precision=0];
	optional double nav_hdg = 7 [(dccl.field).max=359, (dccl.field).min=0, (dccl.field).precision=0];
	optional double nav_spd = 8 [(dccl.field).max=6.0, (dccl.field).min=0.0, (dccl.field).precision=1];
	optional double nav_dep = 9 [(dccl.field).max=6400.0, (dccl.field).min=0.0, (dccl.field).precision=1];
	optional int32 tgt_num = 10 [(dccl.field).max=31, (dccl.field).min=0];
	optional int32 state = 11 [(dccl.field).max=2, (dccl.field).min=0];
	optional double x = 12 [(dccl.field).max=100000, (dccl.field).min=-100000, (dccl.field).precision=0];
	optional double y = 13 [(dccl.field).max=100000, (dccl.field).min=-100000, (dccl.field).precision=0];
	optional double heading = 14 [(dccl.field).max=359, (dccl.field).min=0, (dccl.field).precision=0];
	optional double speed = 15 [(dccl.field).max=20.0, (dccl.field).min=-2.0, (dccl.field).precision=1];
} 

message LAMSS_TRACK_GEO { 
	option (dccl.msg).id = 125;
	option (dccl.msg).max_bytes = 32;
	optional double time = 1 [(dccl.field).codec="_time", (dccl.field).in_head=true];
	optional int32 node = 2 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional int32 _dest_id = 3 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional string MessageType = 4 [default="LAMSS_TRACK_GEO", (dccl.field).static_value="LAMSS_TRACK_GEO", (dccl.field).codec="_static"];
	optional double nav_lon = 5 [(dccl.field).max=100000, (dccl.field).min=-100000, (dccl.field).precision=0];
	optional double nav_lat = 6 [(dccl.field).max=100000, (dccl.field).min=-100000, (dccl.field).precision=0];
	optional double nav_hdg = 7 [(dccl.field).max=359, (dccl.field).min=0, (dccl.field).precision=0];
	optional double nav_spd = 8 [(dccl.field).max=6.0, (dccl.field).min=0.0, (dccl.field).precision=1];
	optional double nav_dep = 9 [(dccl.field).max=6400.0, (dccl.field).min=0.0, (dccl.field).precision=1];
	optional int32 tgt_num = 10 [(dccl.field).max=31, (dccl.field).min=0];
	optional int32 state = 11 [(dccl.field).max=2, (dccl.field).min=0];
    optional double lon = 12 [
        (dccl.field).max = 180,
        (dccl.field).min = -180,
        (dccl.field).precision = 5
    ];
    optional double lat = 13 [
        (dccl.field).max = 90,
        (dccl.field).min = -90,
        (dccl.field).precision = 5
    ];
 
	optional double heading = 14 [(dccl.field).max=359, (dccl.field).min=0, (dccl.field).precision=0];
	optional double speed = 15 [(dccl.field).max=20.0, (dccl.field).min=-2.0, (dccl.field).precision=1];
} 
