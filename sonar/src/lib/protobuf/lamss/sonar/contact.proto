	optional double rate = 19 [(dccl.field).max=10.00, (dccl.field).min=-10.00, (dccl.field).precision=2];
	optional double rate_error = 20 [(dccl.field).max=7.00, (dccl.field).min=0.00, (dccl.field).precision=2];
