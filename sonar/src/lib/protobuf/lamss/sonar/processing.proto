import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";

message LAMSS_PROCESSING { 
    
	option (dccl.msg).id = 61;
	option (dccl.msg).max_bytes = 32;
        option (dccl.msg).codec_version = 4;
	optional double _time = 1 [(dccl.field).codec="_time", (dccl.field).in_head=true];
	optional int32 _src_id = 2 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional int32 _rcv_id = 3 [(dccl.field).max=31, (dccl.field).min=0, (dccl.field).in_head=true];
	optional string MessageType = 4 [default="LAMSS_PROCESSING", (dccl.field).static_value="LAMSS_PROCESSING", (dccl.field).codec="_static"];

        optional ProcessingTypeEnum processing_type = 11 [default =  BROADBAND];
        enum ProcessingTypeEnum {
           BROADBAND = 1;
           TONES = 2;
        }
        optional double center_frequency  = 12 [default = 900, (dccl.field).max=12000.0, (dccl.field).min=0.0, (dccl.field).precision=0];
        optional double bandwidth  = 13 [default = 200, (dccl.field).max=6000.0, (dccl.field).min=0.0, (dccl.field).precision=0];
        repeated double tones = 40 [(dccl.field).max=16000, (dccl.field).min=0, (dccl.field).precision=0, (dccl.field).max_repeat=4];
        optional bool reset_tracker = 17 [default = false];
} 
