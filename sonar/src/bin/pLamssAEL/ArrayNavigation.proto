import "dccl/protobuf/option_extensions.proto";
import "goby/common/protobuf/option_extensions.proto";

message ArrayNavigation { 
    optional double ael_x = 1;
    optional double ael_y = 2;
    optional double ael_z = 3;
    optional double ael_heading = 4 [default = 0];
    optional double ael_pitch = 5 [default = 0];
    optional double ael_roll = 6 [default = 0];
} 
