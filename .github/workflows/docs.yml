#
# Builds the documentation site from main and deploys it to GitHub Pages (Settings -> Pages ->
# Source: GitHub Actions). Pull requests are checked by the CircleCI `docs` job instead.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ./init.sh --yes
        run: ./init.sh --yes
      - name: lamss docs build --strict
        run: |
          . "$HOME/.config/lamss/env.sh"
          lamss docs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
