
import "goby/moos/protobuf/goby_moos_app.proto";
import "goby/common/protobuf/option_extensions.proto";
import "lamss_deploy.proto";
import "lamss_transit.proto";


message LamssMissionManagerConfig
{
  optional GobyMOOSAppConfig common = 1 [(goby.field).description="Configuration common to all Goby MOOS applications"]; // see goby_moos_app.proto

  optional double min_opbox_distance = 2 [default = 500];
  optional double operation_radius   = 3 [default = 10000];
  optional double operation_radius_percent   = 4 [default = 95];
  optional double deploy_duration = 5 [default = 1800];
  optional double prosecute_duration = 6 [default = 1200];
  optional DeployLocationEnum deploy_location = 7 [default = STATION];
  enum DeployLocationEnum {
     STATION = 1;
     CURRENT = 2;
  }
  optional int32  topside_id = 8      [default = 1];
  optional double abort_x = 9 [default = 0];
  optional double abort_y = 10[default = 0];
  optional double abort_depth = 11 [default = 30];
  optional double abort_speed = 12 [default = 1.5];
  optional LAMSS_DEPLOY initial_deploy = 13;
  optional LAMSS_TRANSIT initial_transit = 14;
  optional bool homing_beacon = 15 [default = false];
  optional double homing_beacon_frequency = 16 [default = 0];
  optional double homing_interval = 17 [default = 600];
  optional double homing_duration = 18 [default = 300];
  optional string tracking_message = 19 [default = "ICEX_TRACKING_VEHICLE_POS_IN"];
}

