import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";

message LAMSS_PROSECUTE
{
    option (dccl.msg).id = 19;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 4;
    optional double _time = 1
        [(dccl.field).codec = "_time", (dccl.field).in_head = true];
    optional int32 _src_id = 2 [
        (dccl.field).max = 31,
        (dccl.field).min = 0,
        (dccl.field).in_head = true
    ];
    optional int32 _rcv_id = 3 [
        (dccl.field).max = 31,
        (dccl.field).min = 0,
        (dccl.field).in_head = true
    ];
    optional string MessageType = 4 [
        default = "LAMSS_PROSECUTE",
        (dccl.field).static_value = "LAMSS_PROSECUTE",
        (dccl.field).codec = "_static"
    ];
    optional Prosecute_MissionEnum Prosecute_Mission = 15
        [default = PROSECUTE_MISSION_TRACK_ONLY];
    enum Prosecute_MissionEnum
    {
        PROSECUTE_MISSION_TRACK_ONLY = 0;
        PROSECUTE_MISSION_TRACK_CLASSIFY = 1;
    }
    optional Prosecute_TypeEnum Prosecute_Type = 5
        [default = PROSECUTE_TYPE_ADAPTIVE];
    enum Prosecute_TypeEnum
    {
        PROSECUTE_TYPE_ADAPTIVE = 0;
        PROSECUTE_TYPE_TMA_ZIGZAG = 1;
        PROSECUTE_TYPE_POLYGON = 2;
    }
    optional double Prosecute_Duration = 6 [
        (dccl.field).max = 20470.000000,
        (dccl.field).min = 0.000000,
        (dccl.field).precision = -1
    ];
    optional int32 Target_Number = 7
        [(dccl.field).max = 255, (dccl.field).min = 0];
    oneof east
    {
        double Target_X = 8 [
            (dccl.field).max = 100000,
            (dccl.field).min = -100000,
            (dccl.field).precision = 0
        ];
        double Target_Longitude = 58 [
            (dccl.field).max = 180,
            (dccl.field).min = -180,
            (dccl.field).precision = 4
        ];
    }
    oneof north
    {
        double Target_Y = 9 [
            (dccl.field).max = 100000,
            (dccl.field).min = -100000,
            (dccl.field).precision = 0
        ];
        double Target_Latitude = 59 [
            (dccl.field).max = 90,
            (dccl.field).min = -90,
            (dccl.field).precision = 4
        ];
    }
    optional int32 Target_Depth = 10
        [default = 10, (dccl.field).max = 255, (dccl.field).min = 0];
    optional double Target_Heading = 11 [
        default = 0.0,
        (dccl.field).max = 360.0,
        (dccl.field).min = 0.0,
        (dccl.field).precision = 1
    ];
    optional double Target_Speed = 12 [
        default = 0.0,
        (dccl.field).max = 12.7,
        (dccl.field).min = 0.0,
        (dccl.field).precision = 1
    ];
    optional double Array_Angle = 13 [
        default = 80.0,
        (dccl.field).max = 360.0,
        (dccl.field).min = 0.0,
        (dccl.field).precision = 1
    ];
    optional Array_Angle_ModeEnum Array_Angle_Mode = 14
        [default = ARRAY_ANGLE_MODE_dual];
    enum Array_Angle_ModeEnum
    {
        ARRAY_ANGLE_MODE_dual = 0;
        ARRAY_ANGLE_MODE_quad = 1;
    }
    optional ProcessingTypeEnum processing_type = 29 [default = BROADBAND];
    enum ProcessingTypeEnum
    {
        BROADBAND = 1;
        TONES = 2;
    }
    optional double center_frequency = 30 [
        default = 900,
        (dccl.field).max = 12000.0,
        (dccl.field).min = 0.0,
        (dccl.field).precision = 0
    ];
    optional double bandwidth = 31 [
        default = 200,
        (dccl.field).max = 6000.0,
        (dccl.field).min = 0.0,
        (dccl.field).precision = 0
    ];

    repeated double tones = 40 [
        (dccl.field).max = 16000,
        (dccl.field).min = 0,
        (dccl.field).precision = 0,
        (dccl.field).max_repeat = 4
    ];

    optional bool reset_tracker = 36 [default = true];
}
