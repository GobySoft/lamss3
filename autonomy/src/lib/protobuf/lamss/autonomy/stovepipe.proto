import "dccl/protobuf/option_extensions.proto";
import "goby/protobuf/option_extensions.proto";

message LAMSS_STOVEPIPE
{
    option (dccl.msg).id = 30;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 4;
    optional double _time = 1
        [(dccl.field).codec = "_time", (dccl.field).in_head = true];
    optional int32 _src_id = 2 [
        (dccl.field).max = 31,
        (dccl.field).min = 0,
        (dccl.field).in_head = true
    ];
    optional int32 _rcv_id = 3 [
        (dccl.field).max = 31,
        (dccl.field).min = 0,
        (dccl.field).in_head = true
    ];
    optional string MessageType = 4 [
        default = "LAMSS_STOVEPIPE",
        (dccl.field).static_value = "LAMSS_STOVEPIPE",
        (dccl.field).codec = "_static"
    ];
    optional int32 Stovepipe_ID = 5
        [(dccl.field).max = 31, (dccl.field).min = -31, default = 1];
    oneof east
    {
        double Stovepipe_Longitude = 6 [
            (dccl.field).max = 180,
            (dccl.field).min = -180,
            (dccl.field).precision = 4
        ];
        double Stovepipe_x = 16 [
            (dccl.field).max = 20470.0,
            (dccl.field).min = -20480,
            (dccl.field).precision = -1
        ];  // UTM X
        double Delta_x = 26 [
            (dccl.field).max = 20470.0,
            (dccl.field).min = -20480,
            (dccl.field).precision = -1
        ];  // Meters East of UUV
    }
    oneof north
    {
        double Stovepipe_Latitude = 7 [
            (dccl.field).max = 90.0,
            (dccl.field).min = -90,
            (dccl.field).precision = 4
        ];
        double Stovepipe_y = 17 [
            (dccl.field).max = 20470.0,
            (dccl.field).min = -20480,
            (dccl.field).precision = -1
        ];
        double Delta_y = 27 [
            (dccl.field).max = 20470.0,
            (dccl.field).min = -20480,
            (dccl.field).precision = -1
        ];
    }

    optional double Depth = 8 [
        default = 500.0,
        (dccl.field).max = 500.0,
        (dccl.field).min = 0.0,
        (dccl.field).precision = 1
    ];
    optional int32 Heading = 9
        [(dccl.field).max = 359, (dccl.field).min = 0, default = 0];
    optional int32 Major_Axis = 10
        [(dccl.field).max = 1000, (dccl.field).min = 0, default = 0];
    optional int32 Minor_Axis = 11
        [(dccl.field).max = 1000, (dccl.field).min = 0, default = 0];
    optional int32 Verteces = 12
        [(dccl.field).max = 18, (dccl.field).min = 4, default = 8];
}
